<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Звуки Мира 🌍</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap');

:root {
  --primary: #FF6B9D;
  --yellow:  #FFD93D;
  --green:   #6BCB77;
  --blue:    #4D96FF;
  --purple:  #C77DFF;
  --orange:  #FF9A3C;
  --teal:    #2EC4B6;
  --text:    #2D3436;
  --shadow:  0 8px 28px rgba(0,0,0,0.10);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: #E8F4FD;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
}

.sky {
  position: fixed; inset: 0; z-index: 0;
  background: linear-gradient(180deg, #B8E4FF 0%, #E8F4FD 60%, #D4F5C4 100%);
  overflow: hidden;
}
.cloud {
  position: absolute; background: white;
  border-radius: 50px; opacity: 0.75;
  animation: drift linear infinite;
}
@keyframes drift { from{transform:translateX(-220px)} to{transform:translateX(110vw)} }

header {
  position: relative; z-index: 2;
  width: 100%; max-width: 520px;
  padding: 18px 20px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: 'Baloo 2', cursive;
  font-size: 24px; font-weight: 800;
  color: var(--blue); text-shadow: 2px 2px 0 rgba(77,150,255,0.2);
}
.logo span { color: var(--primary); }
.cat-badge {
  background: white; border-radius: 20px; padding: 6px 14px;
  font-size: 13px; font-weight: 800; color: #636E72;
  box-shadow: var(--shadow);
}

.progress-row {
  position: relative; z-index: 2;
  width: 100%; max-width: 520px;
  padding: 12px 20px 0;
  display: flex; align-items: center; gap: 10px;
}
.progress-wrap {
  flex: 1; height: 12px;
  background: rgba(255,255,255,0.6); border-radius: 20px; overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
}
.progress-bar {
  height: 100%; border-radius: 20px;
  background: linear-gradient(90deg, var(--primary), var(--yellow));
  transition: width 0.5s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 2px 8px rgba(255,107,157,0.4);
}
.progress-label { font-size: 13px; font-weight: 900; color: #636E72; min-width: 36px; text-align: right; }

main {
  position: relative; z-index: 2;
  width: 100%; max-width: 520px;
  padding: 14px 16px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}

.sound-card {
  width: 100%; background: white; border-radius: 28px;
  padding: 22px 20px 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
}
.sound-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, var(--blue), var(--purple), var(--primary), var(--yellow));
}

.sound-icon-wrap {
  width: 100px; height: 100px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 58px; position: relative; cursor: pointer;
  transition: transform 0.15s; user-select: none;
}
.sound-icon-wrap:active { transform: scale(0.93); }

.sound-icon-wrap .ring {
  position: absolute; inset: -8px; border-radius: 50%;
  border: 3px solid currentColor; opacity: 0;
}
.sound-icon-wrap.playing .ring { animation: ringPulse 1s ease-out infinite; }
.sound-icon-wrap.playing .ring:nth-child(2) { animation-delay: 0.33s; }
.sound-icon-wrap.playing .ring:nth-child(3) { animation-delay: 0.66s; }
@keyframes ringPulse {
  0%  { transform: scale(0.9); opacity: 0.7; }
  100%{ transform: scale(1.6); opacity: 0; }
}
.sound-icon-wrap.playing { animation: iconRock 0.5s ease infinite alternate; }
@keyframes iconRock {
  from { transform: scale(1) rotate(-4deg); }
  to   { transform: scale(1.1) rotate(4deg); }
}

.task-text {
  font-family: 'Baloo 2', cursive;
  font-size: 20px; font-weight: 700; color: var(--text);
  text-align: center; line-height: 1.3;
}

.play-btn {
  background: linear-gradient(135deg, var(--blue), #2563EB);
  color: white; border: none; border-radius: 50px;
  padding: 12px 32px;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800;
  cursor: pointer; box-shadow: 0 4px 16px rgba(77,150,255,0.45);
  transition: transform 0.15s;
  display: flex; align-items: center; gap: 10px;
}
.play-btn:active { transform: scale(0.95); }
.play-btn:disabled { opacity: 0.6; cursor: default; }

.eq-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.eq-bar  { width: 4px; border-radius: 2px; background: white; }
.eq-bar:nth-child(1){ height:8px  } .eq-bar:nth-child(2){ height:14px }
.eq-bar:nth-child(3){ height:20px } .eq-bar:nth-child(4){ height:14px }
.eq-bar:nth-child(5){ height:8px  }
.play-btn.playing .eq-bar { animation: eqAnim 0.4s ease infinite alternate; }
.play-btn.playing .eq-bar:nth-child(1){ animation-delay:0s   }
.play-btn.playing .eq-bar:nth-child(2){ animation-delay:0.08s}
.play-btn.playing .eq-bar:nth-child(3){ animation-delay:0.16s}
.play-btn.playing .eq-bar:nth-child(4){ animation-delay:0.24s}
.play-btn.playing .eq-bar:nth-child(5){ animation-delay:0.32s}
@keyframes eqAnim { from{transform:scaleY(0.2)} to{transform:scaleY(1)} }

.answer-grid {
  width: 100%; display: grid;
  grid-template-columns: 1fr 1fr; gap: 12px;
}
.ans-card {
  background: white; border-radius: 22px;
  padding: 16px 10px 14px; box-shadow: var(--shadow);
  border: 4px solid transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
  user-select: none; position: relative;
}
.ans-card:active { transform: scale(0.95); }
.ans-emoji { font-size: 52px; line-height: 1; transition: transform 0.2s; }
.ans-label { font-size: 15px; font-weight: 900; color: var(--text); text-align: center; }
.ans-card .tick { position: absolute; top: 8px; right: 10px; font-size: 20px; opacity: 0; }

.ans-card.correct { border-color: var(--green); background: #F0FFF4; animation: correctPop 0.45s cubic-bezier(0.34,1.56,0.64,1); }
.ans-card.correct .ans-emoji { transform: scale(1.2); }
.ans-card.correct .tick { opacity: 1; }
.ans-card.wrong    { border-color: var(--primary); background: #FFF0F5; animation: wrongWiggle 0.4s ease; }
.ans-card.wrong .tick { opacity: 1; }
.ans-card.disabled { pointer-events: none; }
.ans-card.highlight{ border-color: var(--green); background: #F0FFF4; }

@keyframes correctPop   { 0%{transform:scale(1)} 45%{transform:scale(1.09)} 100%{transform:scale(1)} }
@keyframes wrongWiggle  {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}   60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}

.feedback {
  font-family: 'Baloo 2', cursive; font-size: 26px; font-weight: 800;
  text-align: center; min-height: 36px;
  opacity: 0; transform: scale(0.8);
  transition: opacity 0.25s, transform 0.25s;
}
.feedback.show { opacity: 1; transform: scale(1); }
.feedback.good { color: var(--green); }
.feedback.bad  { color: var(--primary); }

.next-btn {
  display: none;
  background: linear-gradient(135deg, var(--primary), var(--orange));
  color: white; border: none; border-radius: 50px;
  padding: 15px 50px;
  font-family: 'Baloo 2', cursive; font-size: 22px; font-weight: 800;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255,107,157,0.45), 0 3px 0 #C44478;
  transition: transform 0.12s, box-shadow 0.12s;
}
.next-btn:active { transform: translateY(2px); box-shadow: 0 3px 10px rgba(255,107,157,0.45),0 0 0 #C44478; }
.next-btn.visible { display: inline-block; animation: btnPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes btnPop { from{transform:scale(0.4);opacity:0} to{transform:scale(1);opacity:1} }

#win-screen {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: linear-gradient(160deg, #E8F4FD, #D4F5C4);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 30px;
}
#win-screen.show { display: flex; animation: screenIn 0.5s ease; }
@keyframes screenIn { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }

.win-emoji { font-size: 90px; animation: winSpin 0.7s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes winSpin { from{transform:scale(0) rotate(-40deg)} to{transform:scale(1) rotate(0)} }
.win-title {
  font-family: 'Baloo 2', cursive; font-size: 44px; font-weight: 800;
  color: var(--primary); text-shadow: 3px 3px 0 #FFB3D0; text-align: center;
}
.win-sub { font-size: 17px; font-weight: 800; color: #636E72; text-align: center; }
.win-score-box { background: white; border-radius: 24px; padding: 16px 44px; box-shadow: var(--shadow); text-align: center; }
.win-score-box .num {
  font-family: 'Baloo 2', cursive; font-size: 58px; font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1;
}
.win-score-box .lbl { font-size: 13px; font-weight: 900; color: #B2BECD; text-transform: uppercase; letter-spacing: 2px; }
.restart-btn {
  background: linear-gradient(135deg, var(--green), #3DAD4B);
  color: white; border: none; border-radius: 50px; padding: 17px 50px;
  font-family: 'Baloo 2', cursive; font-size: 23px; font-weight: 800;
  cursor: pointer; box-shadow: 0 6px 20px rgba(107,203,119,0.5);
  transition: transform 0.12s;
}
.restart-btn:active { transform: scale(0.97); }

.confetti-piece {
  position: fixed; pointer-events: none; z-index: 200;
  animation: cFall linear forwards;
}
@keyframes cFall {
  0%  { opacity:1;   transform: translateY(-10px) rotate(0deg); }
  100%{ opacity:0.3; transform: translateY(105vh)  rotate(540deg); }
}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<header>
  <div class="logo">Звуки <span>Мира</span> 🌍</div>
  <div class="cat-badge" id="cat-badge">🐾 Животные</div>
</header>

<div class="progress-row">
  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progress-label">0 / 11</div>
</div>

<main>
  <div class="sound-card">
    <div class="sound-icon-wrap" id="sound-icon" onclick="playCurrentSound()">
      <div class="ring" style="color:#4D96FF"></div>
      <div class="ring" style="color:#4D96FF"></div>
      <div class="ring" style="color:#4D96FF"></div>
      <span id="sound-emoji">🔊</span>
    </div>
    <div class="task-text" id="task-text">Что издаёт этот звук?</div>
    <button class="play-btn" id="play-btn" onclick="playCurrentSound()">
      <div class="eq-bars">
        <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div>
      </div>
      <span id="play-label">Играть звук</span>
    </button>
  </div>

  <div class="answer-grid" id="answer-grid"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Дальше →</button>
</main>

<div id="win-screen">
  <div class="win-emoji">🏆</div>
  <div class="win-title">Молодец!</div>
  <div class="win-sub">Ты знаешь все звуки мира!</div>
  <div class="win-score-box">
    <div class="num" id="win-score">0</div>
    <div class="lbl">правильных ответов</div>
  </div>
  <button class="restart-btn" onclick="restartGame()">🔄 Играть ещё!</button>
</div>

<script>
const ALL_QUESTIONS = [
  {
    cat:'🐾 Животные', soundFile:'cat.mp3',
    soundEmoji:'🐱', cardColor:'#FF9A3C',
    taskText:'Кто так говорит?',
    answers:[
      {emoji:'🐱',label:'Кошка',  correct:true },
      {emoji:'🐶',label:'Собака', correct:false},
      {emoji:'🐄',label:'Корова', correct:false},
      {emoji:'🐸',label:'Лягушка',correct:false},
    ]
  },
  {
    cat:'🐾 Животные', soundFile:'собака.mp3',
    soundEmoji:'🐶', cardColor:'#FFD93D',
    taskText:'Кто так лает?',
    answers:[
      {emoji:'🐱',label:'Кошка', correct:false},
      {emoji:'🐶',label:'Собака',correct:true },
      {emoji:'🐷',label:'Свинка',correct:false},
      {emoji:'🐮',label:'Корова',correct:false},
    ]
  },
  {
    cat:'🐾 Животные', soundFile:'cow.mp3',
    soundEmoji:'🐄', cardColor:'#6BCB77',
    taskText:'Кто так мычит?',
    answers:[
      {emoji:'🐑',label:'Овечка', correct:false},
      {emoji:'🐴',label:'Лошадь', correct:false},
      {emoji:'🐄',label:'Корова', correct:true },
      {emoji:'🐐',label:'Козочка',correct:false},
    ]
  },
  {
    cat:'🌿 Природа', soundFile:'rain.mp3',
    soundEmoji:'🌧️', cardColor:'#4D96FF',
    taskText:'Что стучит по крыше?',
    answers:[
      {emoji:'🌧️',label:'Дождь', correct:true },
      {emoji:'❄️', label:'Снег',  correct:false},
      {emoji:'🌬️',label:'Ветер', correct:false},
      {emoji:'🌊', label:'Волны', correct:false},
    ]
  },
  {
    cat:'🌿 Природа', soundFile:'thunder.mp3',
    soundEmoji:'⛈️', cardColor:'#636E72',
    taskText:'Что гремит в небе?',
    answers:[
      {emoji:'✈️', label:'Самолёт',correct:false},
      {emoji:'⛈️',label:'Гром',    correct:true },
      {emoji:'🚀', label:'Ракета', correct:false},
      {emoji:'💥', label:'Взрыв',  correct:false},
    ]
  },
  {
    cat:'🌿 Природа', soundFile:'ветер.mp3',
    soundEmoji:'🌬️', cardColor:'#74C0FC',
    taskText:'Что шумит за окном?',
    answers:[
      {emoji:'🌊', label:'Море',  correct:false},
      {emoji:'🌬️',label:'Ветер', correct:true },
      {emoji:'🔥', label:'Костёр',correct:false},
      {emoji:'🌧️',label:'Дождь', correct:false},
    ]
  },
  {
    cat:'🚗 Транспорт', soundFile:'поезд.mp3',
    soundEmoji:'🚂', cardColor:'#C77DFF',
    taskText:'Что едет по рельсам?',
    answers:[
      {emoji:'🚗',label:'Машина', correct:false},
      {emoji:'🚂',label:'Поезд',  correct:true },
      {emoji:'✈️',label:'Самолёт',correct:false},
      {emoji:'🚢',label:'Корабль',correct:false},
    ]
  },
  {
    cat:'🚗 Транспорт', soundFile:'plane.mp3',
    soundEmoji:'✈️', cardColor:'#4D96FF',
    taskText:'Что летит высоко в небе?',
    answers:[
      {emoji:'🚀',label:'Ракета',        correct:false},
      {emoji:'🚁',label:'Вертолёт',      correct:false},
      {emoji:'✈️',label:'Самолёт',       correct:true },
      {emoji:'🎈',label:'Воздушный шар', correct:false},
    ]
  },
  {
    cat:'🏠 Дома', soundFile:'телефон.mp3',
    soundEmoji:'📱', cardColor:'#FF6B9D',
    taskText:'Что звонит?',
    answers:[
      {emoji:'⏰',label:'Будильник',correct:false},
      {emoji:'📱',label:'Телефон',  correct:true },
      {emoji:'🔔',label:'Колокол',  correct:false},
      {emoji:'🎵',label:'Музыка',   correct:false},
    ]
  },
  {
    cat:'🏠 Дома', soundFile:'часы.mp3',
    soundEmoji:'⏰', cardColor:'#FF9A3C',
    taskText:'Что тикает на стене?',
    answers:[
      {emoji:'📱',label:'Телефон',correct:false},
      {emoji:'⏰',label:'Часы',   correct:true },
      {emoji:'🎹',label:'Пианино',correct:false},
      {emoji:'🔔',label:'Дверь',  correct:false},
    ]
  },
  {
    cat:'🏠 Дома', soundFile:'вода.mp3',
    soundEmoji:'🚿', cardColor:'#2EC4B6',
    taskText:'Что журчит в кране?',
    answers:[
      {emoji:'🍳',label:'Сковородка',correct:false},
      {emoji:'🚿',label:'Вода',      correct:true },
      {emoji:'🧁',label:'Пирожное',  correct:false},
      {emoji:'🎵',label:'Музыка',    correct:false},
    ]
  },
];

// ── AUDIO ─────────────────────────────────────────────────────────────────
const audioCache = {};
let currentAudio = null;

function getAudio(file) {
  if (!audioCache[file]) audioCache[file] = new Audio(file);
  return audioCache[file];
}

function playSound(file, onEnd) {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  const a = getAudio(file);
  a.currentTime = 0;
  currentAudio = a;
  const timer = setTimeout(() => { a.pause(); a.currentTime = 0; if (onEnd) onEnd(); }, 5000);
  a.onended = () => { clearTimeout(timer); if (onEnd) onEnd(); };
  a.onerror = () => { clearTimeout(timer); if (onEnd) onEnd(); };
  a.play().catch(() => { if (onEnd) onEnd(); });
}

// ── STATE ─────────────────────────────────────────────────────────────────
let questions=[], currentQ=0, correctCount=0, answered=false, isPlaying=false;

function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

function initGame() {
  questions=shuffle([...ALL_QUESTIONS]);
  currentQ=0; correctCount=0; answered=false; isPlaying=false;
  renderQuestion();
}

function renderQuestion() {
  const q=questions[currentQ];
  answered=false; isPlaying=false;

  document.getElementById('cat-badge').textContent=q.cat;
  document.getElementById('progress-bar').style.width=(currentQ/questions.length*100)+'%';
  document.getElementById('progress-label').textContent=`${currentQ} / ${questions.length}`;

  const icon=document.getElementById('sound-icon');
  icon.style.background=q.cardColor+'22';
  icon.querySelectorAll('.ring').forEach(r=>r.style.color=q.cardColor);
  icon.classList.remove('playing');
  document.getElementById('sound-emoji').textContent=q.soundEmoji;
  document.getElementById('task-text').textContent=q.taskText;

  const pb=document.getElementById('play-btn');
  pb.classList.remove('playing'); pb.disabled=false;
  document.getElementById('play-label').textContent='Играть звук';

  const fb=document.getElementById('feedback');
  fb.className='feedback'; fb.textContent='';
  document.getElementById('next-btn').className='next-btn';

  const grid=document.getElementById('answer-grid');
  grid.innerHTML='';
  shuffle([...q.answers]).forEach(ans=>{
    const card=document.createElement('div');
    card.className='ans-card';
    card.innerHTML=`
      <div class="tick">${ans.correct?'✅':'❌'}</div>
      <div class="ans-emoji">${ans.emoji}</div>
      <div class="ans-label">${ans.label}</div>`;
    card.addEventListener('click',()=>handleAnswer(card,ans.correct));
    grid.appendChild(card);
  });

  setTimeout(playCurrentSound, 600);
}

function playCurrentSound() {
  if(isPlaying) return;
  isPlaying=true;
  const q=questions[currentQ];
  const pb=document.getElementById('play-btn');
  const iconWrap=document.getElementById('sound-icon');
  pb.classList.add('playing'); pb.disabled=true;
  document.getElementById('play-label').textContent='Звучит...';
  iconWrap.classList.add('playing');
  playSound(q.soundFile,()=>{
    isPlaying=false;
    pb.classList.remove('playing'); pb.disabled=false;
    document.getElementById('play-label').textContent='🔁 Ещё раз';
    iconWrap.classList.remove('playing');
  });
}

function handleAnswer(card, isCorrect) {
  if(answered) return;
  answered=true;
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}
  const pb=document.getElementById('play-btn');
  pb.classList.remove('playing'); pb.disabled=false;
  document.getElementById('play-label').textContent='🔁 Ещё раз';
  document.getElementById('sound-icon').classList.remove('playing');
  isPlaying=false;

  document.querySelectorAll('.ans-card').forEach(c=>c.classList.add('disabled'));
  const fb=document.getElementById('feedback');

  if(isCorrect){
    card.classList.add('correct'); correctCount++;
    const praise=['Молодец! 🎉','Отлично! ⭐','Умница! 💛','Верно! 🌟','Супер! 🎈'];
    fb.textContent=praise[Math.floor(Math.random()*praise.length)];
    fb.className='feedback good show';
  } else {
    card.classList.add('wrong');
    document.querySelectorAll('.ans-card').forEach(c=>{
      if(c.querySelector('.tick').textContent==='✅') c.classList.add('highlight');
    });
    fb.textContent='Не угадал, смотри на подсказку!';
    fb.className='feedback bad show';
  }
  setTimeout(()=>{ document.getElementById('next-btn').className='next-btn visible'; },700);
}

function nextQuestion() {
  currentQ++;
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}
  if(currentQ>=questions.length) showWin();
  else renderQuestion();
}

function showWin() {
  document.getElementById('win-score').textContent=correctCount;
  document.getElementById('win-screen').classList.add('show');
  launchConfetti();
}

function restartGame() {
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;}
  document.getElementById('win-screen').classList.remove('show');
  initGame();
}

function launchConfetti() {
  const colors=['#FF6B9D','#FFD93D','#6BCB77','#4D96FF','#C77DFF','#FF9A3C','#2EC4B6'];
  for(let i=0;i<70;i++){
    setTimeout(()=>{
      const p=document.createElement('div');
      p.className='confetti-piece';
      p.style.cssText=`left:${Math.random()*100}vw;top:0;
        width:${8+Math.random()*10}px;height:${8+Math.random()*10}px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        border-radius:${Math.random()>.5?'50%':'3px'};
        animation-duration:${2+Math.random()*2}s;
        animation-delay:${Math.random()*0.5}s;`;
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),4500);
    },i*35);
  }
}

function makeClouds() {
  const sky=document.getElementById('sky');
  for(let i=0;i<5;i++){
    const c=document.createElement('div');
    c.className='cloud';
    const w=80+Math.random()*120, h=w*0.45;
    c.style.cssText=`width:${w}px;height:${h}px;top:${5+Math.random()*35}%;
      left:${Math.random()*100}vw;animation-duration:${20+Math.random()*30}s;
      animation-delay:-${Math.random()*20}s;`;
    c.innerHTML=`
      <div style="position:absolute;width:${h*.9}px;height:${h*.9}px;
        background:white;border-radius:50%;top:-${h*.3}px;left:${w*.2}px"></div>
      <div style="position:absolute;width:${h*.7}px;height:${h*.7}px;
        background:white;border-radius:50%;top:-${h*.2}px;left:${w*.5}px"></div>`;
    sky.appendChild(c);
  }
}

makeClouds();
initGame();
</script>
</body>
</html>
